# Production stack: docker compose -f compose.prod.yaml --env-file .env.production up -d
# See docs/deployment.md.
name: hris-prod

x-app: &app
  image: ${APP_IMAGE:-hris-app:prod}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  env_file: .env.production
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    DB_HOST: db
    REDIS_HOST: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app

  web:
    image: ${WEB_IMAGE:-hris-web:prod}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  horizon:
    <<: *app
    command: php artisan horizon
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 60s
      timeout: 10s
      retries: 3

  scheduler:
    <<: *app
    command: php artisan schedule:work

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hris}
      POSTGRES_USER: ${DB_USERNAME:-hris}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hris} -d ${DB_DATABASE:-hris}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    entrypoint: ["/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${DB_USERNAME:-hris}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE:-hris}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_AT: ${BACKUP_AT:-02:00}
      TZ: ${TZ:-Asia/Manila}
    volumes:
      - ./docker/backup:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
