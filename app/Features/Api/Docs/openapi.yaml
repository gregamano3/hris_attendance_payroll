openapi: 3.1.0
info:
  title: HRIS Attendance Payroll API
  version: 1.0.0
  description: |
    Personal access token API. Create a token under **My account → API tokens**
    and send it as `Authorization: Bearer <token>`.

    A request succeeds only when the token has the required scope **and** the
    token owner's role allows the action. Responses are JSON; amounts are
    decimal strings in Philippine pesos. Requests are rate limited per user
    (default 60/minute, `429` with `Retry-After` when exceeded).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: '{{APP_URL}}/api/v1'
security:
  - bearerAuth: []
tags:
  - name: Account
  - name: Employees
  - name: Attendance
  - name: Leaves
  - name: Payslips
paths:
  /me:
    get:
      tags: [Account]
      summary: Current user, permissions and linked employee
      description: 'Scope: `profile:read`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      email: { type: string, format: email }
                      role: { type: [string, 'null'] }
                      permissions: { type: array, items: { type: string } }
                      token_abilities: { type: array, items: { type: string } }
                      employee: { oneOf: [{ $ref: '#/components/schemas/Employee' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees:
    get:
      tags: [Employees]
      summary: Employee directory
      description: 'Scope: `employees:read`. Permission: `employees.view`. Government IDs, bank details and pay are never returned.'
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: branch_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [active, on_leave, resigned, terminated] } }
        - { name: updated_since, in: query, description: Incremental sync, schema: { type: string, format: date-time } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Employee' } }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees/{id}:
    get:
      tags: [Employees]
      summary: One employee
      description: 'Scope: `employees:read`. Permission: `employees.view`.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Employee' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /attendance/days:
    get:
      tags: [Attendance]
      summary: Computed attendance days
      description: 'Scope: `attendance:read`. Your own record by default; another employee needs `attendance.view` or must be on your team. Range up to 62 days (default: last 14 days).'
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AttendanceDay' } }
                  meta: { $ref: '#/components/schemas/RangeMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /attendance/time-logs:
    get:
      tags: [Attendance]
      summary: Raw punches
      description: 'Scope: `attendance:read`. Same access rules as attendance days.'
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TimeLog' } }
                  meta: { $ref: '#/components/schemas/RangeMeta' }
    post:
      tags: [Attendance]
      summary: Clock in or out
      description: |
        Scope: `attendance:write`. Records a punch for **your own** employee record at
        the server time. Without `type` it toggles like the web clock (in → out). Branch
        IP and geofence restrictions apply; send coordinates when your branch has a geofence.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [in, out, break_out, break_in] }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/TimeLog' } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leave-types:
    get:
      tags: [Leaves]
      summary: Leave types with your remaining balance
      description: 'Scope: `leaves:read`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        code: { type: string }
                        name: { type: string }
                        is_paid: { type: boolean }
                        attachment_required_after_days: { type: [integer, 'null'] }
                        remaining_days: { type: [number, 'null'] }
  /leave-requests:
    get:
      tags: [Leaves]
      summary: Your leave requests
      description: 'Scope: `leaves:read`.'
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Leaves]
      summary: File a leave request
      description: 'Scope: `leaves:write`. Leaves that need a supporting document must be filed on the web.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leave_type_id, start_date, end_date]
              properties:
                leave_type_id: { type: integer }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                day_part: { type: string, enum: [full, am, pm], default: full }
                reason: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Filed (pending approval)
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/LeaveRequest' } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leave-requests/{id}/cancel:
    post:
      tags: [Leaves]
      summary: Cancel a pending leave request
      description: 'Scope: `leaves:write`.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/LeaveRequest' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not pending, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /payslips:
    get:
      tags: [Payslips]
      summary: Your payslips (finalized runs)
      description: 'Scope: `payslips:read`.'
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PayslipSummary' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
  /payslips/{id}:
    get:
      tags: [Payslips]
      summary: Payslip with lines
      description: 'Scope: `payslips:read`.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/PayslipSummary'
                      - type: object
                        properties:
                          taxable_income: { $ref: '#/components/schemas/Amount' }
                          employer_contributions: { $ref: '#/components/schemas/Amount' }
                          attendance: { type: object, additionalProperties: { type: number } }
                          lines:
                            type: array
                            items:
                              type: object
                              properties:
                                kind: { type: string, enum: [earning, deduction, employer] }
                                code: { type: string }
                                label: { type: string }
                                quantity: { type: [number, 'null'] }
                                unit: { type: [string, 'null'] }
                                amount: { $ref: '#/components/schemas/Amount' }
                                taxable: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Personal access token, shown once at creation (format `<id>|hris_<secret>`).'
  parameters:
    EmployeeId: { name: employee_id, in: query, description: Defaults to your own employee record, schema: { type: integer } }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
  responses:
    Unauthenticated: { description: Missing, invalid or expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Missing scope or permission, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    Amount:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      examples: ['15000.00']
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        total: { type: integer }
    RangeMeta:
      type: object
      properties:
        employee_id: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
    Employee:
      type: object
      properties:
        id: { type: integer }
        employee_no: { type: string }
        first_name: { type: string }
        middle_name: { type: [string, 'null'] }
        last_name: { type: string }
        suffix: { type: [string, 'null'] }
        full_name: { type: string }
        email: { type: [string, 'null'] }
        department: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string } } }
        position: { type: [object, 'null'], properties: { id: { type: integer }, title: { type: string } } }
        branch: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string } } }
        supervisor_id: { type: [integer, 'null'] }
        employment_type: { type: string }
        status: { type: string }
        hired_at: { type: string, format: date }
        regularized_at: { type: [string, 'null'], format: date }
        separated_at: { type: [string, 'null'], format: date }
        updated_at: { type: [string, 'null'], format: date-time }
    AttendanceDay:
      type: object
      properties:
        date: { type: string, format: date }
        status: { type: string }
        time_in: { type: [string, 'null'], format: date-time }
        time_out: { type: [string, 'null'], format: date-time }
        worked_minutes: { type: integer }
        late_minutes: { type: integer }
        undertime_minutes: { type: integer }
        overbreak_minutes: { type: integer }
        overtime_minutes: { type: integer }
        night_diff_minutes: { type: integer }
        is_rest_day: { type: boolean }
        holiday_type: { type: [string, 'null'] }
        leave_fraction: { type: number }
    TimeLog:
      type: object
      properties:
        id: { type: integer }
        logged_at: { type: string, format: date-time }
        type: { type: string, enum: [in, out, break_out, break_in] }
        source: { type: string }
    LeaveRequest:
      type: object
      properties:
        id: { type: integer }
        leave_type: { type: object, properties: { id: { type: integer }, code: { type: string }, name: { type: string } } }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        day_part: { type: string, enum: [full, am, pm] }
        days: { type: number }
        reason: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        review_remarks: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
    PayslipSummary:
      type: object
      properties:
        id: { type: integer }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        pay_date: { type: string, format: date }
        run_type: { type: string }
        currency: { type: string, const: PHP }
        gross_pay: { $ref: '#/components/schemas/Amount' }
        total_deductions: { $ref: '#/components/schemas/Amount' }
        net_pay: { $ref: '#/components/schemas/Amount' }
